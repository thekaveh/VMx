version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /langs/typescript
      - /examples/typescript/console/hello-vmx
      - /examples/typescript/react/notes-showcase
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    ignore:
      - dependency-name: typescript
        versions: [">=6.0.0"]
      - dependency-name: jsdom
        versions: [">=30.0.0"]
    groups:
      npm:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: cargo
    directories:
      - /langs/rust
      - /examples/rust/console/hello-vmx
      - /examples/rust/tui/notes-showcase
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    groups:
      cargo:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: uv
    directories:
      - /langs/python
      - /examples/python
      - /examples/python/textual/inspector
      - /examples/python/textual/notes_showcase
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: pip
    directory: /docs
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: nuget
    directories:
      - /langs/csharp
      - /examples/csharp
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    ignore:
      - dependency-name: coverlet.collector
        versions: ["10.0.1"]
      - dependency-name: coverlet.msbuild
        versions: ["10.0.1"]
      - dependency-name: FluentAssertions
        versions: [">=7.0.0"]
      - dependency-name: Microsoft.Extensions.DependencyInjection
        versions: [">=9.0.0"]
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
