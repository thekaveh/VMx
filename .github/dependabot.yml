version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /langs/typescript
      - /packages/react
      # The React 18 dependency tree of the adapter's CI matrix (#1334).
      - /packages/react-18-deps
      - /examples/typescript/console/hello-vmx
      - /examples/typescript/react/notes-showcase
      - /examples/typescript/integration-recipes
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    ignore:
      - dependency-name: jsdom
        versions: [">=30.0.0"]
      # packages/react-18-deps stays on React 18. Dependabot cannot ignore a
      # dependency in one directory of a shared entry, and a separate entry
      # would split each update of the adapter's other dependencies from its
      # React 18 copy. So no directory of this entry, the adapter and the React
      # Notes Showcase included, gets a React major proposal. A new React
      # major is a deliberate adapter change.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: cargo
    directories:
      - /langs/rust
      - /examples/rust/console/hello-vmx
      - /examples/rust/tui/notes-showcase
      - /benchmarks/rust
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    groups:
      cargo:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: uv
    directories:
      - /langs/python
      - /examples/python
      - /examples/python/textual/inspector
      - /examples/python/textual/notes_showcase
      - /examples/python/nicegui/notes_showcase
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: pip
    directory: /docs
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: nuget
    directories:
      - /langs/csharp
      - /examples/csharp
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    ignore:
      - dependency-name: coverlet.collector
        versions: ["10.0.1", "10.1.0"]
      - dependency-name: coverlet.msbuild
        versions: ["10.0.1", "10.1.0"]
      - dependency-name: FluentAssertions
        versions: [">=7.0.0"]
      - dependency-name: Microsoft.Extensions.DependencyInjection
        versions: [">=9.0.0"]
      - dependency-name: xunit.v3
        versions: [">=4.0.0"]
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
