name: wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/assets/diagrams/**"
      - "docs/content/**"
      - "docs/maintenance/**"
      - "docs/manifest.yaml"
      - "docs/opener.yaml"
      - "assets/vmx-poster.png"
      - "spec/**"
      - "scripts/docs/**"
      - "tools/docs/validate_diagrams.py"
      - "Makefile"
      - "docs/requirements.txt"
      - "docs/requirements.in"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

# Serialize wiki publishes: the job clones the wiki repo fresh and pushes to
# master with a non-force push, so two overlapping runs would race and the
# loser would fail on a non-fast-forward push.
concurrency:
  group: wiki
  cancel-in-progress: false

# The build job runs third-party packages and the docs gate with a read-only
# token. Only the publish job, which runs no installed package, can write.
permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            librsvg2-bin=2.58.0+dfsg-1build1 \
            pngquant=2.18.0-1build2
          python -m pip install --require-hashes -r docs/requirements.txt
      - name: Audit docs dependencies
        run: python -m pip_audit --local
      - name: Run full documentation gate
        run: make docs-check
      - name: Generate wiki
        run: python -m scripts.docs.build_docs --wiki
      - name: Validate diagrams
        run: |
          python docs/assets/diagrams/generate_diagrams.py --check
          python -m scripts.docs.validate_diagrams
      - name: Upload generated wiki
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-wiki
          path: generated/wiki
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download generated wiki
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-wiki
          path: generated/wiki
      - name: Install wiki deploy key when configured
        env:
          WIKI_DEPLOY_KEY_VALUE: ${{ secrets.WIKI_DEPLOY_KEY }}
        run: |
          if [ -n "$WIKI_DEPLOY_KEY_VALUE" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$WIKI_DEPLOY_KEY_VALUE" > ~/.ssh/wiki_key
            chmod 600 ~/.ssh/wiki_key
          fi
      - name: Publish wiki
        env:
          WIKI_DEPLOY_KEY: /home/runner/.ssh/wiki_key
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          WIKI_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$WIKI_DEPLOY_KEY" ]; then
            python -m scripts.docs.push_wiki --push
          else
            WIKI_REMOTE="https://github.com/thekaveh/VMx.wiki.git" \
              python -m scripts.docs.push_wiki --push
          fi
      - name: Verify published wiki
        run: python -m scripts.docs.push_wiki --check-published
