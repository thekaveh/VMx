name: swift

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  hang-probe:
    # Temporary (#550): repeats the NotesShowcase suite on the tag-suggestion
    # fix from a throwaway branch. Never merged.
    name: notes-showcase repeat probe (temporary, #550)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build NotesShowcase tests
        working-directory: examples/swift/notes-showcase
        run: swift build --build-tests
      - name: Repeat the suite, parallel and serial, and sample any hang
        working-directory: examples/swift/notes-showcase
        run: |
          set -u
          hangs=0 failures=0 last_report=
          probe() {
            label=$1 runs=$2
            shift 2
            for i in $(seq 1 "$runs"); do
              "$@" > run.log 2>&1 &
              pid=$!
              for _ in $(seq 1 90); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$pid" 2>/dev/null; then
                hangs=$((hangs + 1))
                echo "::group::HANG in $label run $i"
                grep 'Testing \|started\.' run.log | tail -4
                ps -axo pid,etime,args | grep '[x]ctest'
                for x in $(pgrep -x xctest); do
                  sample "$x" 3 -mayDie -file "sample-$i-$x.txt" > /dev/null 2>&1
                  cat "sample-$i-$x.txt"
                done
                echo "::endgroup::"
                pkill -x xctest || true
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              elif ! wait "$pid"; then
                failures=$((failures + 1))
                echo "::group::FAILURE in $label run $i"
                tail -40 run.log
                report=$(ls -t "$HOME"/Library/Logs/DiagnosticReports/xctest* 2>/dev/null | head -1 || true)
                if [ -n "$report" ] && [ "$report" != "$last_report" ]; then
                  last_report=$report
                  echo "crash report: $report"
                  python3 - "$report" <<'PY' || true
          import json, sys
          header, body = open(sys.argv[1], encoding="utf-8").read().split("\n", 1)
          crash = json.loads(body)
          images = crash.get("usedImages", [])
          print("exception:", crash.get("exception"))
          print("termination:", crash.get("termination"))
          print("asi:", crash.get("asi"))
          for index, thread in enumerate(crash.get("threads", [])):
              faulting = " (faulting)" if index == crash.get("faultingThread") else ""
              print(f"--- thread {index}{faulting} {thread.get('name', '')} {thread.get('queue', '')}")
              for frame in thread.get("frames", [])[:60]:
                  image = images[frame["imageIndex"]] if 0 <= frame.get("imageIndex", -1) < len(images) else {}
                  print(
                      f"  {image.get('name', '?')} {frame.get('symbol', '?')}"
                      f" {frame.get('sourceFile', '')}:{frame.get('sourceLine', '')}"
                  )
          PY
                fi
                echo "::endgroup::"
              fi
            done
            echo "$label: runs=$runs hangs=$hangs failures=$failures (cumulative)"
          }
          probe parallel 300 swift test --skip-build --parallel

  ownership-probe:
    # Temporary (#551): repeats ContainerOwnershipTransferTests under coverage
    # instrumentation from a throwaway branch. Never merged.
    name: ownership repeat probe (temporary, #551)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repeat ContainerOwnershipTransferTests under coverage
        run: |
          set -u
          runs=300 failures=0
          for i in $(seq 1 "$runs"); do
            if ! swift test --package-path langs/swift --enable-code-coverage -Xswiftc -Xllvm -Xswiftc -instrprof-atomic-counter-update-all --filter ContainerOwnershipTransferTests > run.log 2>&1; then
              failures=$((failures + 1))
              echo "::group::FAILURE in run $i"
              grep -E ": error:|failed \(" run.log | head -20
              tail -5 run.log
              echo "::endgroup::"
            fi
          done
          echo "ownership: runs=$runs failures=$failures"
