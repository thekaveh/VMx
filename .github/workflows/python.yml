name: python

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "langs/python/**"
      - "examples/python/**"
      - "spec/**"
      - ".github/workflows/python.yml"
      - "tools/check-python-interpreter.py"
      - "tools/tests/test_check_python_interpreter.py"
      - "tools/tests/test_python_release_workflow.py"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

defaults:
  run:
    working-directory: langs/python

jobs:
  build:
    timeout-minutes: 30
    name: build & test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            langs/python/pyproject.toml
            langs/python/uv.lock

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Report uv package cache restoration
        env:
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        run: echo "setup-uv cache-hit=$CACHE_HIT"
        shell: bash

      - name: Seed a deliberately mismatched environment
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          uv python install 3.14
          uv python list --only-installed --managed-python
          uv venv --python 3.14 .venv
          .venv/bin/python ../../tools/check-python-interpreter.py --expected-version 3.14 --venv .venv

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Assert selected Python identity
        id: interpreter
        run: uv run python ../../tools/check-python-interpreter.py --venv .venv --capture-output

      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          uv export --locked --no-dev --no-emit-project --output-file /tmp/vmx-runtime.txt
          uvx --from pip-audit==2.10.1 python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --tool-context -- -m pip_audit --requirement /tmp/vmx-runtime.txt

      - name: Ruff lint
        run: uv run python ../../tools/check-python-interpreter.py --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m ruff check src tests

      - name: Ruff format check
        run: uv run python ../../tools/check-python-interpreter.py --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m ruff format --check src tests

      - name: Mypy
        run: uv run python ../../tools/check-python-interpreter.py --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m mypy --strict src/vmx

      - name: Pytest
        run: uv run python ../../tools/check-python-interpreter.py --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m pytest --cov=vmx --cov-report=xml -v

      - name: Repeat controlled lifecycle interleaving
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          vmx_cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          for vmx_mode in normal single-cpu; do
            vmx_prefix=()
            if [[ "$vmx_mode" == single-cpu ]]; then
              vmx_prefix=(taskset -c "$vmx_cpu")
            fi
            for vmx_run in 1 2 3; do
              echo "VMx controlled interleaving: mode=$vmx_mode run=$vmx_run cpu=$vmx_cpu"
              timeout --kill-after=5s 120s "${vmx_prefix[@]}" uv run python ../../tools/check-python-interpreter.py --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m pytest tests/unit/components/test_lifecycle_race.py -k foreign_dispose_waits
            done
          done

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: langs/python/coverage.xml
          flags: python
          fail_ci_if_error: false

  examples:
    timeout-minutes: 30
    # Syncs + tests the Notes-Showcase Textual example (Phase 8 of the
    # notes-showcase plan). Kept as a separate job because the existing
    # `build` job pins `defaults.run.working-directory: langs/python` and runs
    # a 3-OS × 5-python matrix; the example only needs a single combo to
    # confirm the showcase package builds against the workspace-local
    # `vmx` (editable, path-sourced in pyproject.toml).
    name: examples (notes-showcase)
    runs-on: ubuntu-latest
    # Override workflow-level `defaults.run.working-directory: langs/python` so
    # `uv --directory examples/...` resolves from the repo root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            examples/python/textual/notes_showcase/pyproject.toml
            examples/python/textual/notes_showcase/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: notes-showcase sync
        # `dev` is declared under [dependency-groups] in the showcase's
        # pyproject.toml (PEP 735), not [project.optional-dependencies]; uv
        # syncs default dependency groups automatically, so no --extra/--group
        # flag is needed for pytest to be present.
        run: uv sync --locked --directory examples/python/textual/notes_showcase

      - name: Assert example Python identity
        id: interpreter
        run: uv run --directory examples/python/textual/notes_showcase python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --capture-output

      - name: notes-showcase ruff lint
        run: uv run --directory examples/python/textual/notes_showcase python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m ruff check

      - name: notes-showcase ruff format check
        run: uv run --directory examples/python/textual/notes_showcase python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m ruff format --check

      - name: notes-showcase mypy strict
        run: uv run --directory examples/python/textual/notes_showcase python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m mypy --strict src

      - name: notes-showcase tests
        run: uv run --directory examples/python/textual/notes_showcase python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m pytest

  small-examples:
    timeout-minutes: 20
    name: examples (console + tk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            examples/python/pyproject.toml
            examples/python/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync examples
        run: uv sync --locked --directory examples/python

      - name: Assert example Python identity
        id: interpreter
        run: uv run --directory examples/python python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --capture-output

      - name: Ruff lint
        run: uv run --directory examples/python python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m ruff check console tk

      - name: Ruff format check
        run: uv run --directory examples/python python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m ruff format --check console tk

      - name: Mypy strict
        run: uv run --directory examples/python python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m mypy --strict console tk

      - name: Run console example
        run: uv run --directory examples/python python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m hello_vmx

      - name: Compile Tk example
        run: uv run --directory examples/python python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m compileall tk/todo_app

  inspector:
    timeout-minutes: 30
    # vmx_inspector (Textual TUI) is a separate standalone uv project; gate it
    # under the same ruff/mypy/pytest standards as the lib + showcase so the
    # quality bar stays uniform across all Python examples.
    name: examples (vmx-inspector)
    runs-on: ubuntu-latest
    # Override workflow-level `defaults.run.working-directory: langs/python` so
    # `uv --directory examples/...` resolves from the repo root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            examples/python/textual/inspector/pyproject.toml
            examples/python/textual/inspector/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: inspector sync
        run: uv sync --locked --directory examples/python/textual/inspector

      - name: Assert example Python identity
        id: interpreter
        run: uv run --directory examples/python/textual/inspector python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --capture-output

      - name: inspector ruff lint
        run: uv run --directory examples/python/textual/inspector python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m ruff check

      - name: inspector ruff format check
        run: uv run --directory examples/python/textual/inspector python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m ruff format --check

      - name: inspector mypy strict
        run: uv run --directory examples/python/textual/inspector python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m mypy --strict src

      - name: inspector tests
        run: uv run --directory examples/python/textual/inspector python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --venv .venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -m pytest

  package:
    timeout-minutes: 15
    name: package (wheel + sdist)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync source package environment
        run: uv sync --project langs/python --locked --all-extras
      - name: Assert source package Python identity
        id: interpreter
        run: uv run --project langs/python python tools/check-python-interpreter.py --venv langs/python/.venv --capture-output
      - name: Build wheel and sdist
        run: uv build --project langs/python --out-dir dist
      - name: Verify exact wheel and sdist contents
        run: uv run --project langs/python python tools/check-python-interpreter.py --venv langs/python/.venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- tools/check-python-package.py --dist dist
      - name: Verify exact local wheel in a fresh environment
        run: |
          set -euo pipefail
          version=$(uv run --project langs/python python tools/check-python-interpreter.py --venv langs/python/.venv --expected-executable "${{ steps.interpreter.outputs.executable }}" -- -c \
            "from vmx.__about__ import __version__; print(__version__)")
          uv venv --python 3.12 .package-venv
          uv pip install --python .package-venv/bin/python dist/*.whl
          .package-venv/bin/python tools/check-python-interpreter.py --expected-version 3.12 --venv .package-venv -- langs/python/scripts/smoke_test.py "$version"
      - name: Test extracted sdist
        run: |
          set -euo pipefail
          extract_dir="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$extract_dir"
          sdist_root="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$sdist_root"
          uv sync --project "$sdist_root" --locked --all-extras
          uv run --project "$sdist_root" python tools/check-python-interpreter.py --venv "$sdist_root/.venv" -- -m pytest "$sdist_root/tests/conformance" -q

  required:
    timeout-minutes: 5
    name: "required: python"
    if: always()
    needs: [build, examples, small-examples, inspector, package]
    runs-on: ubuntu-latest
    # This aggregator job has no checkout, so override the workflow-level
    # `defaults.run.working-directory: langs/python` (which would not exist here)
    # back to the workspace root so the jq gate can start.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every Python job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success")' <<<"$RESULTS"
