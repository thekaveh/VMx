name: release-please

# release-please watches main for Conventional Commits and maintains a
# long-lived "release PR" per package that bumps the version + updates
# CHANGELOG.md according to what's accumulated since the last tag.
# Merging that PR pushes a `python-v<X.Y.Z>` tag (the component prefix
# comes from release-please-config.json's `component: python` setting,
# which keeps tags coexisting with future `csharp-v*`, `typescript-v*`,
# and `swift-v*` flavors), which fires `release.yml`'s tag-triggered
# publish pipeline.
#
# Human gate stays on the release PR merge: review the version bump,
# review the auto-generated CHANGELOG entry, then merge → tag fires →
# publish runs → environment approval gates the actual PyPI upload.

on:
  push:
    branches: [main]

# release-please needs to push commits to its release branch and open PRs
# against main. A repository secret backed by a fine-grained PAT or GitHub App
# token is required because PRs created with the default GITHUB_TOKEN do not
# trigger the required pull_request workflows.
permissions:
  contents: write
  pull-requests: write

# Serialize release-PR maintenance: concurrent runs both push to the release
# branch / update the release PR and can conflict (the action recommends a
# concurrency group).
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release-please source and manifest state
        id: release-state
        run: python3 tools/check-release-please-state.py --github-output "$GITHUB_OUTPUT"
      - name: Require RELEASE_PLEASE_TOKEN
        if: steps.release-state.outputs.ready == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          test -n "$RELEASE_PLEASE_TOKEN" || {
            echo "::error::Configure RELEASE_PLEASE_TOKEN so generated PRs trigger required CI."
            exit 1
          }
      - name: Maintain Python release PR
        id: release
        if: steps.release-state.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # The repository default is the develop integration branch, but
          # releases are cut from protected main after a promotion PR.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Locate the open Python release PR
        id: release-pr
        if: steps.release-state.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR_HEAD: release-please--branches--main--components--python
        run: |
          set -euo pipefail
          count="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f base=main \
            -f "head=$GITHUB_REPOSITORY_OWNER:$RELEASE_PR_HEAD" \
            --jq 'length')"
          if [ "$count" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          elif [ "$count" -eq 1 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "head=$RELEASE_PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Found $count open Python release PRs; expected at most one."
            exit 1
          fi
      - name: Check out updated Python release PR
        if: steps.release-pr.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-pr.outputs.head }}
          path: release-pr
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Restore the canonical Unreleased changelog section
        if: steps.release-pr.outputs.found == 'true'
        env:
          RELEASE_PR_HEAD: ${{ steps.release-pr.outputs.head }}
        run: |
          set -euo pipefail
          python3 tools/ensure-release-changelog-unreleased.py \
            release-pr/langs/python/CHANGELOG.md
          if git -C release-pr diff --quiet -- langs/python/CHANGELOG.md; then
            echo "The Python changelog already has its canonical Unreleased section."
            exit 0
          fi
          git -C release-pr config user.name "github-actions[bot]"
          git -C release-pr config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C release-pr add langs/python/CHANGELOG.md
          git -C release-pr commit -m "chore: restore unreleased changelog section"
          git -C release-pr push origin "HEAD:${RELEASE_PR_HEAD}"
