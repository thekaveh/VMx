name: security-audit

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  secrets:
    timeout-minutes: 10
    name: committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  codeql:
    timeout-minutes: 45
    name: "CodeQL (${{ matrix.language }})"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: rust
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Swift packages
        if: matrix.language == 'swift'
        run: |
          swift build -c release --package-path langs/swift
          swift build -c release --package-path examples/swift/notes-showcase
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  npm:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - langs/typescript
          - packages/react
          - examples/typescript/console/hello-vmx
          - examples/typescript/react/notes-showcase
          - examples/typescript/integration-recipes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --prefix "${{ matrix.project }}" --ignore-scripts
      - run: npm run check:deps --prefix "${{ matrix.project }}"
      - run: npm audit --prefix "${{ matrix.project }}" --package-lock-only --audit-level=low

  cargo:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          toolchain: stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the library, example, and benchmark Cargo locks
        run: |
          cargo audit --file langs/rust/Cargo.lock --deny warnings
          cargo audit --file examples/rust/console/hello-vmx/Cargo.lock --deny warnings
          cargo audit --file examples/rust/tui/notes-showcase/Cargo.lock --deny warnings
          cargo audit --file benchmarks/rust/Cargo.lock --deny warnings

  python:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - langs/python
          - examples/python
          - examples/python/textual/inspector
          - examples/python/textual/notes_showcase
          - examples/python/nicegui/notes_showcase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.12"
      - run: uv export --project . --locked --no-dev --no-emit-project --no-emit-local --output-file /tmp/runtime.txt
        working-directory: ${{ matrix.project }}
      - run: uvx --from pip-audit==2.10.1 python "$GITHUB_WORKSPACE/tools/check-python-interpreter.py" --tool-context -- -m pip_audit --requirement /tmp/runtime.txt
        working-directory: ${{ matrix.project }}

  docs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m venv /tmp/vmx-docs-audit
      - run: /tmp/vmx-docs-audit/bin/pip install --require-hashes -r docs/requirements.txt
      - run: /tmp/vmx-docs-audit/bin/python -m pip_audit --local

  nuget:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore with the NuGet audit
        # NU1901-NU1904 name a vulnerable package. NU1004 names a lock file
        # that differs from the project graph (#1361).
        run: |
          dotnet restore langs/csharp/VMx.sln --locked-mode \
            -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low \
            "-warnaserror:NU1901;NU1902;NU1903;NU1904" || {
            echo "::error::The locked restore or the NuGet audit failed. For NU1901-NU1904, update the vulnerable package. For NU1004, a packages.lock.json differs from the project graph. Regenerate it with: dotnet restore langs/csharp/VMx.sln --force-evaluate (see docs/maintenance/2026-11-09-dependency-lock-regeneration.md)."
            exit 1
          }
      - run: >
          dotnet restore examples/csharp/Examples.sln -p:EnableWindowsTargeting=true
          -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low
          "-warnaserror:NU1901;NU1902;NU1903;NU1904"

  required:
    timeout-minutes: 5
    name: "required: security"
    if: always()
    needs: [secrets, codeql, npm, cargo, python, docs, nuget]
    runs-on: ubuntu-latest
    steps:
      - name: Require secret/code scanning and every dependency audit
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success")' <<<"$RESULTS"
