name: ADR proposal
description: Propose an Architecture Decision Record.
labels: [documentation]
body:
  - type: input
    id: title
    attributes:
      label: Proposed ADR title
      description: Leave out the ADR number. A maintainer assigns it from spec/ADRs/README.md.
      placeholder: e.g., Inject a scheduler for delayed work
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What's the situation that demands a decision?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision + consequences
    validations:
      required: true
