name: Bug report — C# (VMx NuGet packages)
description: Something is broken in the C# flavor.
labels: [bug, ".NET"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences that say what is wrong and where.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      description: The C# flavor ships three independently versioned NuGet packages.
      options:
        - VMx (core)
        - VMx.Extensions.DependencyInjection
        - VMx.Notifications
        - Not sure / multiple
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "e.g., 3.30.0 (VMx) / 1.2.0 (VMx.Notifications) / 2.1.1 (VMx.Extensions.DependencyInjection)"
    validations:
      required: true
  - type: input
    id: tfm
    attributes:
      label: Target framework
      placeholder: "e.g., net8.0, netstandard2.0"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        How to reproduce the defect, the observed output (error text, wrong
        value or stack trace) and the behavior that you expected. Put the
        reproduction code in the next field.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest program that shows the defect that Context describes.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Checkable conditions that show the defect is fixed, one checkbox per
        condition.
      placeholder: "- [ ] Calling `dispose()` twice raises no error."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        A `Location | What it shows` table. Each row names a file and line
        range, a log, a CI run or a link, and says in one sentence what it
        shows.
      value: |
        | Location | What it shows |
        |---|---|
    validations:
      required: false
