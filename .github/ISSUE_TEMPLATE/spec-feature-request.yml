name: Spec — feature request
description: Propose a behavior change that affects all language flavors.
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences that say what should change and why.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        The user-facing problem, the spec change that you propose (chapter,
        new conformance IDs) and any flavor-specific constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Checkable conditions that show the change is done, one checkbox per
        condition.
      placeholder: "- [ ] spec/NN-chapter.md states the new rule, and every flavor passes the new conformance ID."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        A `Location | What it shows` table. Each row names a spec section,
        a file and line range or a link, and says in one sentence what it
        shows.
      value: |
        | Location | What it shows |
        |---|---|
    validations:
      required: false
