# pre-commit configuration. Run `pre-commit install` once locally to wire the hooks.
# See https://pre-commit.com/ for details.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$   # markdown trailing whitespace can be meaningful (line breaks)
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        # The alias keeps `pre-commit run ruff` working (#1335).
        alias: ruff
        # tools/ sits outside langs/python/, so ruff's auto-discovery would
        # never find langs/python/pyproject.toml when invoked on tools/ paths
        # from the repo root. Pass --config explicitly to apply the same
        # rule-set CI enforces (see .github/workflows/conformance.yml).
        args: ["--fix", "--config", "langs/python/pyproject.toml"]
        files: ^(langs/python|tools|scripts/docs|tests/docs|docs/assets/diagrams)/.*\.py$
      - id: ruff-format
        args: ["--config", "langs/python/pyproject.toml"]
        files: ^(langs/python|tools|scripts/docs|tests/docs|docs/assets/diagrams)/.*\.py$
      # The Python console starter is its own project: `notes_app` is
      # first-party and the published `vmx` is third-party. The same overrides
      # run in .github/workflows/conformance.yml. Ruff writes no file into the
      # template folder, so `template_files("python-console")` still passes.
      - id: ruff-check
        alias: ruff
        name: ruff-check (starters/python-console)
        args:
          - "--fix"
          - "--config"
          - "langs/python/pyproject.toml"
          - "--config"
          - "lint.isort.known-first-party = ['notes_app']"
          - "--config"
          - "lint.isort.known-third-party = ['vmx']"
        files: ^starters/python-console/.*\.py$
      - id: ruff-format
        name: ruff-format (starters/python-console)
        args: ["--config", "langs/python/pyproject.toml"]
        files: ^starters/python-console/.*\.py$

  - repo: https://github.com/executablebooks/mdformat
    # mdformat 1.0.0 is incompatible with mdformat-gfm (requires mdformat <0.8.0).
    # Pinned to the latest 0.7.x until mdformat-gfm releases a 1.0-compatible version.
    rev: 0.7.22
    hooks:
      - id: mdformat
        # spec/ and docs/ Markdown plus the six release CHANGELOGs (#1391).
        files: ^((spec|docs)/.*|(langs/[^/]+|packages/react)/CHANGELOG)\.md$
        # mdformat rewrites indented Material tab content into standalone fenced
        # blocks, which builds but renders as separate single-tab groups.
        exclude: |
          (?x)^(
            docs/content/installation\.md|
            docs/content/getting-started/index\.md|
            docs/content/examples/rust-tui-notes-showcase\.md|
            docs/content/flavors/rust\.md|
            docs/content/primitives/(command-families|services-messages-dispatching)\.md|
            docs/content/primitives/viewmodel-families/(composite-family|forwarding-wrapper-family|hierarchical-family)\.md|
            docs/content/primitives/viewmodel-families/specialized/(confirmation-vm|discriminator-vm|form-vm|modal-vm|notification-vm)\.md
          )$
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-tables==1.0.0

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format (C# only)
        # Library files: one VMx.sln run, with --include args built via an
        # array so paths with spaces survive intact. Example files: each file's
        # own project, the nearest directory above it with a .csproj (#1384).
        # Both use --no-restore, so restore the solution or project first.
        entry: |
          bash -c '
            status=0;
            lib=();
            for f in "$@"; do
              case "$f" in
                langs/csharp/*) lib+=("--include" "${f#langs/csharp/}") ;;
                examples/csharp/*)
                  dir=$(dirname "$f");
                  until compgen -G "$dir/*.csproj" > /dev/null || [ "$dir" = "examples/csharp" ]; do
                    dir=$(dirname "$dir");
                  done;
                  for project in "$dir"/*.csproj; do
                    [ -f "$project" ] || continue;
                    dotnet format "$project" --verify-no-changes --no-restore --include "$f" || status=1;
                  done ;;
              esac;
            done;
            if [ ${#lib[@]} -gt 0 ]; then
              (cd langs/csharp && dotnet format VMx.sln --verify-no-changes --no-restore "${lib[@]}") || status=1;
            fi;
            exit $status
          ' --
        language: system
        files: ^(langs|examples)/csharp/.*\.(cs|csproj|props)$
        pass_filenames: true

      - id: eslint-typescript
        name: eslint (TypeScript only)
        # Runs the flavor's own eslint config against staged .ts files. Requires
        # `npm ci` to have populated langs/typescript/node_modules first.
        entry: |
          bash -c '
            paths=();
            for f in "$@"; do paths+=("${f#langs/typescript/}"); done;
            cd langs/typescript && npm exec --no -- eslint "${paths[@]}"
          ' --
        language: system
        files: ^langs/typescript/(src|tests|scripts)/.*\.(ts|tsx|mjs|cjs|js)$
        pass_filenames: true

      # Swift formatting: no pre-commit hook is wired here because `swift format`
      # (part of swift-format, https://github.com/swiftlang/swift-format) is not
      # reliably available in contributor environments — it requires a separate
      # install that is NOT bundled with the Command Line Tools or Xcode. Adding
      # a `language: system` hook that calls `swift format` would silently fail
      # or hard-error for everyone who has not installed it. Swift style
      # conformance is instead enforced in CI via `swift build` in swift.yml
      # (compiler-level checks) and should be verified locally by running
      # `swift format lint --recursive langs/swift/Sources/` when swift-format
      # is available.
