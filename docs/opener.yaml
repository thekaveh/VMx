tagline: One specification. Five idiomatic flavors. Predictable MVVM behavior across UI stacks.
summary: >-
  VMx is a UI-neutral MVVM framework for building viewmodel trees with an
  explicit lifecycle, a message hub, commands, and observable collections. One
  language-neutral specification defines its behavior, and the C#, Python,
  TypeScript, Swift, and Rust flavors implement it in their own language idioms.
poster:
  source: assets/vmx-poster.png
  alt: VMx framework across C#, Python, TypeScript, Swift, and Rust
